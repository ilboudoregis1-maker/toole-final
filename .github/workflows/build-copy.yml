name: build-copy
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["build-aab"]
    types: [completed]
jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci || npm i
      - run: npx cap sync android
      - run: if [ -n "$G" ]; then printf "%s" "$G" > android/app/google-services.json; fi
        env: { G: "${{ secrets.GOOGLE_SERVICES_JSON_COPY }}" }
      - run: echo "$KEYSTORE_B64" | base64 -d > $HOME/cns.keystore
        env: { KEYSTORE_B64: "${{ secrets.KEYSTORE_B64 }}" }
      - name: Copie (autre identifiant et autre nom)
        run: |
          sed -i 's/applicationId "com.cns.tooole"/applicationId "com.cns.tooole.copy"/' android/app/build.gradle
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">T\&#213;\&#213;L\&#233; copy</string>|' android/app/src/main/res/values/strings.xml
          grep -n "applicationId" android/app/build.gradle
          grep -n "app_name" android/app/src/main/res/values/strings.xml
          [ -f android/app/google-services.json ] || : > android/app/src/main/assets/public/toole-push.js
      - run: cd android && ./gradlew assembleRelease
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
      - uses: actions/upload-artifact@v4
        with: { name: apk-copy, path: android/app/build/outputs/apk/release/*.apk }
