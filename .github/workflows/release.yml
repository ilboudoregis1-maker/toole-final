name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: Signer
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          OUT=android/app/build/outputs/apk/release
          if [ -f $OUT/app-release-unsigned.apk ]; then
            echo "$KS_B64" | base64 -d > ks.jks
            BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
            $BT/zipalign -p -f 4 $OUT/app-release-unsigned.apk aligned.apk
            $BT/apksigner sign --ks ks.jks --ks-pass pass:$KS_PASS \
              --ks-key-alias $KEY_ALIAS --key-pass pass:$KEY_PASS \
              --out app-release.apk aligned.apk
          else
            cp $OUT/app-release.apk app-release.apk
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: app-release.apk
          generate_release_notes: true
