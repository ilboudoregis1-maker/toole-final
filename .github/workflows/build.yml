name: build-aab
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci || npm i
      - run: npx cap sync android
      - run: if [ -n "$G" ]; then printf "%s" "$G" > android/app/google-services.json; fi
        env: { G: "${{ secrets.GOOGLE_SERVICES_JSON }}" }
      - run: echo "$KEYSTORE_B64" | base64 -d > $HOME/cns.keystore
        env: { KEYSTORE_B64: "${{ secrets.KEYSTORE_B64 }}" }
      - run: cd android && ./gradlew bundleRelease assembleRelease
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
      - uses: actions/upload-artifact@v4
        with: { name: aab, path: android/app/build/outputs/bundle/release/*.aab }
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: android/app/build/outputs/apk/release/*.apk }
