name: build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci || npm i
      - run: npx cap sync android
      - run: sed -i "s#__CLE__#$K#" android/app/src/main/assets/public/toole-crypt.js
        env: { K: "${{ secrets.TOOLE_KEY }}" }
      - run: if grep -q __CLE__ android/app/src/main/assets/public/toole-crypt.js; then echo "cle absente"; exit 1; fi
      - run: if [ -n "$G" ]; then printf "%s" "$G" > android/app/google-services.json; fi
        env: { G: "${{ secrets.GOOGLE_SERVICES_JSON }}" }
      - run: echo "$KEYSTORE_B64" | base64 -d > $HOME/cns.keystore
        env: { KEYSTORE_B64: "${{ secrets.KEYSTORE_B64 }}" }
      - run: cd android && ./gradlew assembleRelease
        env:
          KEY_ALIAS: CNS
          KEY_PASS: ${{ secrets.KEY_PASS }}
      - uses: actions/upload-artifact@v4
        with:
          name: TOOLE-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 2
