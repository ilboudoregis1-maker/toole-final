name: build
on:
  push:
    branches: [main, nopush]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci || npm i
      - run: npx cap sync android
      - run: if [ -n "$G" ]; then printf "%s" "$G" > android/app/google-services.json; fi
        env: { G: "${{ secrets.GOOGLE_SERVICES_JSON }}" }
      - run: echo "$KEYSTORE_B64" | base64 -d > $HOME/cns.keystore
        env: { KEYSTORE_B64: "${{ secrets.KEYSTORE_B64 }}" }
      - run: cd android && ./gradlew assembleRelease bundleRelease
        env:
          KEY_ALIAS: CNS
          KEY_PASS: ${{ secrets.KEY_PASS }}
      - uses: actions/upload-artifact@v4
        with:
          name: TOOLE-apk-${{ github.ref_name }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: TOOLE-aab-${{ github.ref_name }}
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 2
