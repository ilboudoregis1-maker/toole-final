name: build-release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci || npm i
      - run: npx cap sync android
      - run: if [ -n "$G" ]; then printf "%s" "$G" > android/app/google-services.json; fi
        env: { G: "${{ secrets.GOOGLE_SERVICES_JSON }}" }
      - run: echo "$KEYSTORE_B64" | base64 -d > $HOME/cns.keystore
        env: { KEYSTORE_B64: "${{ secrets.KEYSTORE_B64 }}" }
      - run: cd android && ./gradlew assembleRelease
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
      - name: Publier dans une Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest android/app/build/outputs/apk/release/*.apk --title "APK dernier build" --notes "Build ${{ github.sha }}" --target ${{ github.sha }}
